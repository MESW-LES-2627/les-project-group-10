services:
  runner:
    build: .
    image: les-runner:local
    container_name: les-runner
    restart: unless-stopped
    init: true
    stop_grace_period: 10m
    volumes:
      - runner-data:/home/runner
      - /var/run/docker.sock:/var/run/docker.sock
      - type: bind
        source: /srv/les/runner/_work
        target: /srv/les/runner/_work
        bind:
          create_host_path: false
      - type: bind
        source: /srv/les/staging
        target: /srv/les/staging
        bind:
          create_host_path: false
      - type: bind
        source: /srv/les/production
        target: /srv/les/production
        bind:
          create_host_path: false
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

volumes:
  runner-data:
