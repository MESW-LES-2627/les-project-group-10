x-logging: &logging
  driver: json-file
  options:
    max-size: '10m'
    max-file: '3'

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in the server environment file}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the server environment file}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in the server environment file}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    logging: *logging

  backend:
    image: les-${DEPLOY_ENVIRONMENT:?Set DEPLOY_ENVIRONMENT}-backend:${IMAGE_TAG:?Set IMAGE_TAG to the full commit SHA}
    build:
      context: ./backend
      args:
        COMMIT_SHA: ${IMAGE_TAG}
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      PORT: '3000'
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL using db as the database host}
      JWT_SECRET: ${JWT_SECRET:?Set a separate JWT_SECRET for each environment}
      CLIENT_ORIGIN: ${CLIENT_ORIGIN:?Set the public HTTPS origin}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:?Set a Stripe test secret key}
      STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY:?Set a Stripe test publishable key}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health', {signal: AbortSignal.timeout(5000)}).then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 6s
      retries: 12
      start_period: 10s
    logging: *logging

  frontend:
    image: les-${DEPLOY_ENVIRONMENT:?Set DEPLOY_ENVIRONMENT}-frontend:${IMAGE_TAG:?Set IMAGE_TAG to the full commit SHA}
    build:
      context: ./frontend
      args:
        COMMIT_SHA: ${IMAGE_TAG}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-q', '-T', '5', '-O', '/dev/null', 'http://127.0.0.1/']
      interval: 10s
      timeout: 6s
      retries: 12
      start_period: 5s
    logging: *logging

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: ['tunnel', '--no-autoupdate', 'run']
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:?Set the token for this environment's tunnel}
    logging: *logging

volumes:
  pgdata:
